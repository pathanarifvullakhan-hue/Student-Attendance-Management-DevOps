apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attendance-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: attendance-app
          image: student-attendance-devops:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /app/data/attendance.db
          volumeMounts:
            - name: attendance-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: attendance-data
          persistentVolumeClaim:
            claimName: attendance-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: student-attendance-service
spec:
  type: NodePort
  selector:
    app: student-attendance
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
